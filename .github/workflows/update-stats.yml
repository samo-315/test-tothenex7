name: Update YouTube Stats

on:
  schedule:
    - cron: "*/30 * * * *"   # 30分ごと(実行時刻はGitHub側の混雑状況で多少前後します)
  workflow_dispatch: {}       # Actionsタブから手動実行したい時用

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch YouTube stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-stats.mjs

      - name: Commit stats.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "Update stats.json"
          git push
