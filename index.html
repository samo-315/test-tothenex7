<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>moxymill tothenex7 候補生一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script><style>
  :root{
    --bg: #f5f2fa;
    --card: #ffffff;
    --ink: #29233f;
    --ink-soft: #6b6480;
    --accent: #ff5d7a;
    --accent-soft: #ffe3e9;
    --mint: #2fd8a0;
    --mint-soft: #dffaf0;
    --line: #eae6f4;
    --radius: 18px;
  }
  *{ box-sizing: border-box; }
    body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }
  /* ポップアップ表示中だけ「引っ張って更新」ジェスチャーを無効化する */
  body.modal-open{
    overscroll-behavior-y: contain;
  }
  h1,h2,h3, .tab-btn, .brand{
    font-family: 'Zen Kaku Gothic New', 'Noto Sans JP', sans-serif;
  }

  /* Header */
  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: 18px 16px 0;
  }
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .brand h1{
    font-size: 20px;
    font-weight: 900;
    margin:0;
    letter-spacing: .02em;
  }
  .updated-info{
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.4;
  }
  .status-msg{
    font-size: 11px;
    color: var(--accent);
    min-height: 14px;
    margin-bottom: 10px;
  }

  /* Tabs */
  .tabs{
    display:flex;
    background: var(--card);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(41,35,63,0.06);
  }
  .tab-btn{
    flex:1;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 0;
    border-radius: 999px;
    transition: background .2s, color .2s;
  }
  .tab-btn.active{
    background: var(--ink);
    color: #fff;
  }

  /* Summary toolbar */
  .summary-toolbar{
    display:flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sort-btn{
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .sort-btn.active{
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  /* Main */
  main{ padding: 4px 16px 24px; }
  .grid{
    display:flex;
    flex-direction: column;
    gap: 18px;
  }
  .card{
    background: var(--card);
    border-radius: var(--radius);
    overflow:hidden;
    box-shadow: 0 2px 14px rgba(41,35,63,0.07);
    border: 1px solid var(--line);
  }
  .video-wrap{
    position:relative;
    width:100%;
    background:#000;
    cursor:pointer;
  }
  .video-wrap.ratio-16-9{ aspect-ratio: 16/9; }
  .video-wrap.ratio-9-16{ aspect-ratio: 9/16; max-height: 70vh; margin:0 auto; }
  .video-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .video-wrap iframe{
    width:100%; height:100%; border:none; display:block;
  }
  .play-badge{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  .play-badge::after{
    content:"";
    width:58px; height:58px;
    border-radius:50%;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .play-badge::before{
    content:"";
    position:absolute;
    width:0; height:0;
    border-top: 12px solid transparent;
    border-bottom: 12px solid transparent;
    border-left: 20px solid var(--ink);
    margin-left: 6px;
    z-index:1;
  }

  .stats-row{
    display:flex;
    gap: 10px;
    padding: 12px 16px 4px;
  }
  .stat-pill{
    display:flex;
    align-items:center;
    gap:5px;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .stat-pill.views{ background: var(--mint-soft); color:#0f8f66; }
  .stat-pill.likes{ background: var(--accent-soft); color:#c9385a; }
  .stat-pill .n{ font-variant-numeric: tabular-nums; }
  .graph-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 14px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .graph-btn:disabled{ opacity: 0.35; }

  /* グラフのポップアップ */
  .modal-overlay{
    display:none;
    position: fixed;
    inset: 0;
    background: rgba(41,35,63,0.45);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    width: 100%;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: 16px 16px 24px;
  }
  @media (min-width: 700px){
    .modal-overlay{ align-items: center; }
    .modal-box{ border-radius: 20px; }
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 12px;
  }
  .modal-title{
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 15px;
  }
  .modal-close{
    border:none;
    background: var(--card);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .period-toolbar{
    display:flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .period-btn{
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 11.5px;
    padding: 6px 12px;
    border-radius: 999px;
  }
  .period-btn.active{
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .modal-chart-card{
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--line);
    padding: 14px 10px;
    margin-bottom: 14px;
  }
  .modal-chart-title{
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 6px 8px;
  }
  .modal-chart-wrap{ position: relative; height: 200px; }
  .modal-empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 24px 8px;
  }

  .profile{
    padding: 10px 16px 16px;
  }
  .profile-name{
    display:flex;
    align-items:baseline;
    flex-wrap: wrap;
    gap:8px;
    margin-bottom: 8px;
  }
  .profile-name .name{
    font-size: 17px;
    font-weight: 900;
    font-family: 'Zen Kaku Gothic New', sans-serif;
  }
  .profile-name .reading{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .profile-name .withdrawal-note{
    font-size: 11px;
    font-weight: 700;
    color: #e6396a;
  }
  .profile-grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 10px;
    font-size: 12.5px;
    margin-bottom: 10px;
  }
  .pf-item{ color: var(--ink-soft); }
  .pf-item b{
    display:block;
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    overflow-wrap: break-word;
  }
  .pf-label{
    font-size: 10.5px;
    letter-spacing: .04em;
  }
  .sns-link{
    color: #e6396a;
    font-weight: 700;
    text-decoration: none;
  }
  .comment{
    background: var(--bg);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--ink);
    position: relative;
    overflow-wrap: break-word;
  }
  /* Summary */
  .summary-card{
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 2px 14px rgba(41,35,63,0.07);
    padding: 12px 14px;
    display:flex;
    align-items:center;
    gap: 12px;
  }
  .summary-rank{
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--bg);
    color: var(--ink-soft);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 13px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .summary-card.top1 .summary-rank{ background:#ffe08a; color:#7a5200; }
  .summary-card.top2 .summary-rank{ background:#e3e3ee; color:#4a4763; }
  .summary-card.top3 .summary-rank{ background:#f0d3b8; color:#7a4a1c; }
  .summary-main{ flex:1; min-width:0; }
  .summary-name{
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 15px;
    margin-bottom: 3px;
    overflow-wrap: break-word;
  }
  .summary-breakdown{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .summary-total{
    display:flex;
    align-items:center;
    gap:4px;
    font-weight: 900;
    font-size: 16px;
    color: #c9385a;
    flex-shrink:0;
    font-variant-numeric: tabular-nums;
  }

  .empty-key-warning{
    margin: 16px;
    padding: 14px;
    background: #fff4e5;
    border: 1px solid #ffd699;
    border-radius: 12px;
    font-size: 12.5px;
    line-height: 1.6;
    color: #8a5a00;
  }

  /* 最終ランキング */
.rank-row{
  display:flex;
  align-items:center;
  gap: 12px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: 0 2px 14px rgba(41,35,63,0.07);
  padding: 10px 14px;
}
.rank-num{
  width: 30px;
  flex-shrink:0;
  text-align:center;
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 900;
  font-size: 15px;
  color: var(--ink-soft);
}
.rank-photo{
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg);
}
.rank-name-btn{
  border:none;
  background:none;
  text-align:left;
  padding: 0;
  display:flex;
  flex-direction: column;
  gap: 2px;
}
.rank-name-btn .rank-reading{
  font-size: 10.5px;
  color: var(--ink-soft);
}
.rank-name-btn .rank-name{
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 900;
  font-size: 15px;
  color: var(--ink);
}

.rank-song-btn{
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink-soft);
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 700;
  font-size: 11px;
  padding: 7px 12px;
  border-radius: 999px;
}
.song-popover{
  display: none;
  position: absolute;
  z-index: 150;
  width: 190px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(41,35,63,0.18);
  padding: 12px;
}
.song-popover.open{ display: block; }
.song-popover-row{
  display:flex;
  align-items:center;
  gap: 8px;
  margin-bottom: 10px;
}
.song-popover-row:last-child{ margin-bottom: 0; }
.song-popover-label{
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink-soft);
  width: 44px;
  flex-shrink:0;
  white-space: nowrap;
}
.song-popover-jackets{
  display:flex;
  gap: 6px;
}
.song-popover-jackets img{
  width: 44px;
  height: 44px;
  border-radius: 8px;
  object-fit: cover;
  background: var(--bg);
}

/* 課題曲 */
.song-card{
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: 0 2px 14px rgba(41,35,63,0.07);
  padding: 20px 16px;
}
.song-header{
  text-align: center;
  margin-bottom: 18px;
}
.song-jacket{
  width: 140px;
  height: 140px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 10px;
  background: var(--bg);
}
.song-title{
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 900;
  font-size: 17px;
  margin-bottom: 4px;
}
.song-genre{
  font-size: 12px;
  color: var(--ink-soft);
}
.song-section{ margin-bottom: 16px; }
.song-section:last-child{ margin-bottom: 0; }
.song-section-label{
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--line);
}
.assignee-grid{
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.assignee-item{
  text-align:center;
}
.assignee-photo{
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  object-fit: cover;
  background: var(--bg);
  margin-bottom: 4px;
}
.assignee-name{
  font-size: 10.5px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.3;
}
  
  /* PC(横幅の広い画面)向けレイアウト */
  @media (min-width: 700px){
    header{
      max-width: 900px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }
    main{
      max-width: 900px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }
    .grid{
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      align-items: start;
    }
    /* 集計結果タブは横幅いっぱいの1列リストのまま */
    .summary-card{
      grid-column: 1 / -1;
    }
    .rank-row{
      grid-column: 1 / -1;
    }
    .song-card{
      grid-column: 1 / -1;
    }
    .video-wrap.ratio-9-16{
      max-height: 520px;
    }
    .assignee-grid{
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>to the nex7 候補生一覧</h1>
    <div class="updated-info" id="updatedInfo">データ取得: --</div>
  </div>
  <div class="status-msg" id="statusMsg"></div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="normal">通常動画</button>
    <button class="tab-btn" data-tab="shorts">ショート</button>
    <button class="tab-btn" data-tab="summary">集計結果</button>
    <button class="tab-btn" data-tab="ranking">最終<br>ランキング</button>
    <button class="tab-btn" data-tab="songs">課題曲</button>
  </div>
  <div class="summary-toolbar" id="summaryToolbar" style="display:none;">
    <button class="sort-btn active" data-sort="total">高評価数順</button>
    <button class="sort-btn" data-sort="input">50音順</button>
  </div>

  <!--
    再取得ボタンは一旦非表示にしています。復活させたい場合は
    下記のコメントアウトを外し、CSSでの display:none を解除してください。

  <div class="toolbar">
    <button class="refresh-btn" id="refreshBtn">
      <span class="spin">⟳</span>再取得
    </button>
  </div>
  -->
</header>

<main>
  <div id="keyWarning" class="empty-key-warning" style="display:none;"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalBody">
      <div class="period-toolbar" id="periodToolbar">
        <button class="period-btn" data-period="1">1日</button>
        <button class="period-btn" data-period="3">3日</button>
        <button class="period-btn active" data-period="7">7日</button>
        <button class="period-btn" data-period="30">30日</button>
        <button class="period-btn" data-period="all">全期間</button>
      </div>
      <div class="modal-chart-card">
        <div class="modal-chart-title">👀 再生回数の推移</div>
        <div class="modal-chart-wrap"><canvas id="modalViewsChart"></canvas></div>
      </div>
      <div class="modal-chart-card">
        <div class="modal-chart-title">👍🏻 高評価数の推移</div>
        <div class="modal-chart-wrap"><canvas id="modalLikesChart"></canvas></div>
      </div>
      <div class="modal-empty" id="modalEmpty" style="display:none;">まだ記録されたデータがありません。</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="profileModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="profileModalTitle"></div>
      <button class="modal-close" id="profileModalClose">✕</button>
    </div>
    <div id="profileModalBody"></div>
  </div>
</div>
<div class="song-popover" id="songPopover"></div>

<script>
/* ============================================================
   表示ロジック(通常/ショート/集計結果)
   ============================================================ */

let people = [];               // data.json の中身がここに入る
let currentTab = "normal";     // "normal" | "shorts" | "summary"
let summarySortMode = "total"; // "total" = 高評価数順 / "input" = 50音順

const gridEl = document.getElementById("grid");
const updatedInfoEl = document.getElementById("updatedInfo");
const statusMsgEl = document.getElementById("statusMsg");
const summaryToolbarEl = document.getElementById("summaryToolbar");

function fmt(n){
  if(n === undefined || n === null) return "--";
  return Number(n).toLocaleString("ja-JP");
}

function formatDateTime(iso){
  if(!iso) return "--";
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}

function render(){
  if(currentTab === "summary"){
    renderSummary();
    return;
  }
  if(currentTab === "ranking"){
    renderRanking();
    return;
  }
  if(currentTab === "songs"){
    renderSongs();
    return;
  }
  const isShorts = currentTab === "shorts";
  const idKey = isShorts ? "shortsId" : "normalId";
  const viewsKey = isShorts ? "shortsViews" : "normalViews";
  const likesKey = isShorts ? "shortsLikes" : "normalLikes";

  gridEl.innerHTML = people.map((p, idx) => {
    const vid = p[idKey];
    const thumbUrl = vid ? `https://img.youtube.com/vi/${vid}/hqdefault.jpg` : "";
    return `
    <div class="card">
      <div class="video-wrap ${isShorts ? 'ratio-9-16' : 'ratio-16-9'}"
           data-idx="${idx}" data-id="${vid}">
        ${vid
          ? `<img src="${thumbUrl}" alt="${p.name}"><div class="play-badge"></div>`
          : `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:12px;">動画IDが未設定です</div>`
        }
      </div>
      <div class="stats-row">
        <div class="stat-pill views">👀 <span class="n" data-stat="views-${idx}">${fmt(p[viewsKey])}</span></div>
        <div class="stat-pill likes">👍🏻 <span class="n" data-stat="likes-${idx}">${fmt(p[likesKey])}</span></div>
        <button class="graph-btn" data-idx="${idx}" ${vid ? "" : "disabled"}>📈</button>
      </div>
      <div class="profile">
        <div class="profile-name">
          <span class="name">${p.name}</span>
          <span class="reading">${p.reading}</span>
          ${p.withdrawalNote ? `<span class="withdrawal-note">※${p.withdrawalNote}</span>` : ""}
        </div>
        <div class="profile-grid">
          <div class="pf-item"><span class="pf-label">生年月日</span><b>${p.birthday}</b></div>
          <div class="pf-item"><span class="pf-label">出身地</span><b>${p.hometown}</b></div>
          <div class="pf-item"><span class="pf-label">特技</span><b>${p.specialty}</b></div>

function renderSummary(){
  const rows = people.map(p => {
    const normalLikes = Number(p.normalLikes) || 0;
    const shortsLikes = Number(p.shortsLikes) || 0;
    return {
      name: p.name,
      normalLikes,
      shortsLikes,
      total: normalLikes + shortsLikes

  if(summarySortMode === "total"){
    rows.sort((a, b) => b.total - a.total);
  }

  gridEl.innerHTML = rows.map((r, i) => {
    const rankClass = summarySortMode === "total"
      ? (i === 0 ? "top1" : i === 1 ? "top2" : i === 2 ? "top3" : "")
      : "";
    return `
    <div class="summary-card ${rankClass}">

      <div class="summary-main">

/* ============================================================
   複数ポップアップ共通のスクロールロック(何個開いているか数える方式)
   ============================================================ */

let bodyLockCount = 0;
let bodyLockScrollY = 0;

function lockBodyScroll(){
  if(bodyLockCount === 0){
    bodyLockScrollY = window.scrollY;
    document.body.classList.add("modal-open");
    document.body.style.position = "fixed";
    document.body.style.top = `-${bodyLockScrollY}px`;
    document.body.style.left = "0";
    document.body.style.right = "0";
    document.body.style.width = "100%";
  }
  bodyLockCount++;
}

function unlockBodyScroll(){
  bodyLockCount = Math.max(0, bodyLockCount - 1);
  if(bodyLockCount === 0){
    document.body.classList.remove("modal-open");
    document.body.style.position = "";
    document.body.style.top = "";
    document.body.style.left = "";
    document.body.style.right = "";
    document.body.style.width = "";
    window.scrollTo(0, bodyLockScrollY);
  }
}

/* ============================================================
   最終ランキング: 課題曲ポップアップ(ボタンの真上に表示)
   ============================================================ */

const songPopoverEl = document.getElementById("songPopover");
let songPopoverOpenIdx = null; // 現在開いている人のインデックス(同じボタン再タップで閉じるため)

document.addEventListener("click", (e) => {
  if(!songPopoverEl.classList.contains("open")) return;
  if(songPopoverEl.contains(e.target)) return;
  closeSongPopover();
});

async function openSongPopover(idx, btnEl){
  const alreadyOpen = songPopoverEl.classList.contains("open");
  songPopoverOpenIdx = idx;
  const p = people[idx];
  const list = await ensureSongsLoaded();
  const findJacket = (songId) => {
    const song = list.find(s => s.id === songId);
    return song ? song.jacket : "";
  };

  const vocalJackets = (p.vocalSongs || []).map(findJacket).filter(Boolean);
  const danceJackets = (p.danceSongs || []).map(findJacket).filter(Boolean);

  songPopoverEl.innerHTML = `
    <div class="song-popover-row">
      <div class="song-popover-label">ボーカル</div>
      <div class="song-popover-jackets">
        ${vocalJackets.map(src => `<img src="${src}" alt="">`).join("")}
      </div>
    </div>
    <div class="song-popover-row">
      <div class="song-popover-label">ダンス</div>
      <div class="song-popover-jackets">
        ${danceJackets.map(src => `<img src="${src}" alt="">`).join("")}
      </div>
    </div>
  `;

  // 位置を計算する(ボタンの真上に配置)
  // ロック中(bodyがposition:fixed)はwindow.scrollYが常に0を返すため、
  // その場合は記憶しておいたスクロール位置を使う
  const effectiveScrollY = bodyLockCount > 0 ? bodyLockScrollY : window.scrollY;

  songPopoverEl.style.visibility = "hidden";
  songPopoverEl.classList.add("open");
  const rect = btnEl.getBoundingClientRect();
  const popRect = songPopoverEl.getBoundingClientRect();

  let left = rect.left + window.scrollX + rect.width / 2 - popRect.width / 2;
  const minLeft = 8 + window.scrollX;
  const maxLeft = document.documentElement.clientWidth - popRect.width - 8 + window.scrollX;
  left = Math.max(minLeft, Math.min(left, maxLeft));

  const top = rect.top + effectiveScrollY - popRect.height - 8;

  songPopoverEl.style.left = `${left}px`;
  songPopoverEl.style.top = `${top}px`;
  songPopoverEl.style.visibility = "visible";

  // 既にこのポップアップ自身が開いている(別の人に切り替えただけ)場合は、
  // 二重にロックしないようにする
  if(!alreadyOpen){
    lockBodyScroll();
  }
}

function closeSongPopover(){
  if(!songPopoverEl.classList.contains("open")) return;
  songPopoverEl.classList.remove("open");
  songPopoverOpenIdx = null;
  unlockBodyScroll();
}

/* ============================================================
   推移グラフのポップアップ
   ============================================================ */

let historyData = null;
let historyLoading = null;
let modalViewsChart = null;
let modalLikesChart = null;
let modalAllPoints = [];   // 現在開いている動画の全期間分のデータ(実データのみ、加工なし)
let modalPeriodDays = 7;   // "1" | "3" | "7" | "30" | "all"

const modalOverlayEl = document.getElementById("modalOverlay");
const modalTitleEl = document.getElementById("modalTitle");
const modalEmptyEl = document.getElementById("modalEmpty");
const modalBodyEl = document.getElementById("modalBody");
const periodToolbarEl = document.getElementById("periodToolbar");

async function ensureHistoryLoaded(){
  if(historyData) return historyData;
  if(!historyLoading){
    historyLoading = fetch("history.json", { cache: "no-store" })
      .then(res => res.ok ? res.json() : {})
      .catch(() => ({}));
  }
  historyData = await historyLoading;
  return historyData;
}

function buildTrendDataset(points, valueIndex, color){
  return {
    // 実際に取得した時刻・値をそのまま使う(推定値による補間は行わない)
    data: points.map(p => ({ x: p[0], y: p[valueIndex] })),
    borderColor: color,
    backgroundColor: color,
    borderWidth: 2,
    pointRadius: 0,
    tension: 0.25,
  };
}

const modalChartOptions = {
  responsive: true,
  maintainAspectRatio: false,
  animation: false,
  interaction: { mode: "index", intersect: false },
  plugins: { legend: { display: false } },
  scales: {
    x: {
      type: "time",
      time: {
        unit: "hour",                      // 目盛りは1時間おき
        tooltipFormat: "MM/dd HH:mm",       // ツールチップも日付+時刻
        displayFormats: { hour: "MM/dd HH:mm" } // 軸ラベルも日付+時刻で表示
      },
      ticks: { font: { size: 9 }, maxRotation: 60, minRotation: 45 },
      grid: { color: "#eae6f4" }
    },
    y: {
      ticks: { font: { size: 10 } },
      grid: { color: "#eae6f4" }
    }
  }
};

function filterByPeriod(points, period){
  if(period === "all") return points;
  const days = Number(period);
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  return points.filter(p => new Date(p[0]).getTime() >= cutoff);
}

function drawModalCharts(){
  const points = filterByPeriod(modalAllPoints, modalPeriodDays);

  if(modalViewsChart){ modalViewsChart.destroy(); modalViewsChart = null; }
  if(modalLikesChart){ modalLikesChart.destroy(); modalLikesChart = null; }

  if(points.length === 0){
    modalBodyEl.querySelectorAll(".modal-chart-card").forEach(el => el.style.display = "none");
    modalEmptyEl.style.display = "block";
    return;
  }
  modalBodyEl.querySelectorAll(".modal-chart-card").forEach(el => el.style.display = "block");
  modalEmptyEl.style.display = "none";

  modalViewsChart = new Chart(document.getElementById("modalViewsChart"), {
    type: "line",
    data: { datasets: [buildTrendDataset(points, 1, "#2fd8a0")] },
    options: modalChartOptions
  });
  modalLikesChart = new Chart(document.getElementById("modalLikesChart"), {
    type: "line",
    data: { datasets: [buildTrendDataset(points, 2, "#ff5d7a")] },
    options: modalChartOptions
  });
}

periodToolbarEl.querySelectorAll(".period-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    modalPeriodDays = btn.dataset.period;
    periodToolbarEl.querySelectorAll(".period-btn").forEach(b => b.classList.toggle("active", b === btn));
    drawModalCharts();
  });
});

async function openGraphModal(idx){

  modalPeriodDays = "7";

  modalOverlayEl.classList.remove("open");
  unlockBodyScroll();
}

modalOverlayEl.addEventListener("click", (e) => {

   データ読み込み(data.json / stats.json)
   ============================================================ */

async function loadData(){
  const res = await fetch("data.json", { cache: "no-store" });
  people = await res.json();
}

// 表示中タブの数字だけ差し替え(再生中のiframeを壊さないようにテキストのみ更新)
function applyStatsToDom(){
  if(currentTab === "summary"){
    renderSummary();
    return;
  }
  const isShorts = currentTab === "shorts";
  const viewsKey = isShorts ? "shortsViews" : "normalViews";
  const likesKey = isShorts ? "shortsLikes" : "normalLikes";
  people.forEach((p, idx) => {
    const viewsEl = document.querySelector(`[data-stat="views-${idx}"]`);
    const likesEl = document.querySelector(`[data-stat="likes-${idx}"]`);
    if(viewsEl) viewsEl.textContent = fmt(p[viewsKey]);
    if(likesEl) likesEl.textContent = fmt(p[likesKey]);
  });
}

async function loadStats(){
  try{
    statusMsgEl.textContent = "";
    const res = await fetch("stats.json", { cache: "no-store" });
    if(!res.ok) throw new Error(`stats.json の取得に失敗しました (HTTP ${res.status})`);
    const json = await res.json();
    const byId = json.byId || {};

    people.forEach(p => {
      if(p.normalId && byId[p.normalId]){
        p.normalViews = byId[p.normalId].viewCount;
        p.normalLikes = byId[p.normalId].likeCount;
      }
      if(p.shortsId && byId[p.shortsId]){
        p.shortsViews = byId[p.shortsId].viewCount;
        p.shortsLikes = byId[p.shortsId].likeCount;
      }
    });

    updatedInfoEl.textContent = "データ取得: " + formatDateTime(json.updatedAt);
    applyStatsToDom();
  }catch(err){
    console.error(err);
    statusMsgEl.textContent = "統計データの取得に失敗しました: " + err.message;
  }
}

const REFRESH_INTERVAL_MS = 30 * 60 * 1000; // 30分ごと(GitHub Actionsの実行間隔と合わせる)

(async function init(){
  try{
    await loadData();
    render();
  }catch(err){
    console.error(err);
    statusMsgEl.textContent = "data.json の読み込みに失敗しました: " + err.message;
    return;
  }
  loadStats();
  setInterval(loadStats, REFRESH_INTERVAL_MS);
})();

const YOUTUBE_API_KEY = "YOUR_API_KEY_HERE";

async function fetchStatsLive(){
  if(!YOUTUBE_API_KEY || YOUTUBE_API_KEY === "YOUR_API_KEY_HERE"){
    return;
  }

  const all = [];
  people.forEach((p, idx) => {
    if(p.normalId) all.push({ idx, key: "normalId", statViews: "normalViews", statLikes: "normalLikes", id: p.normalId });
    if(p.shortsId) all.push({ idx, key: "shortsId", statViews: "shortsViews", statLikes: "shortsLikes", id: p.shortsId });
  });
  if(all.length === 0) return;

  const chunkSize = 50;
  for(let i=0; i<all.length; i+=chunkSize){
    const chunk = all.slice(i, i+chunkSize);
    const ids = chunk.map(c=>c.id).join(",");
    const url = `https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${ids}&key=${YOUTUBE_API_KEY}`;

    const data = await res.json();
    const statMap = {};
    (data.items || []).forEach(item => { statMap[item.id] = item.statistics; });
    chunk.forEach(c => {
      const s = statMap[c.id];
      if(s){
        people[c.idx][c.statViews] = s.viewCount;
        people[c.idx][c.statLikes] = s.likeCount;
      }
    });

  updatedInfoEl.textContent = "最終更新 " + new Date().toLocaleString("ja-JP", {

  });
